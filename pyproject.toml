[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wpf-gui-testkit"
version = "0.1.1"
description = "通用 WPF GUI 自动化测试框架 — pip install 即用，零外部服务依赖"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["wpf", "gui-testing", "pywinauto", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing :: UI",
]

dependencies = [
    "pywinauto>=0.6.8",
    "psutil>=5.0.0",
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/pszmy/wpf-gui-testkit"
Repository = "https://github.com/pszmy/wpf-gui-testkit.git"

[tool.setuptools.packages.find]
include = ["wpf_testkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
